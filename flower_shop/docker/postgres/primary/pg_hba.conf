# ---------------------------------------------------------------------------
# Flower Shop — PostgreSQL Primary pg_hba.conf (lab 04: Primary + Replica)
#
# Mounted into the Primary container at /etc/postgresql/pg_hba.conf and used
# via `postgres -c hba_file=/etc/postgresql/pg_hba.conf`.
#
# The important extra rule vs the default file is the `replication` line:
# without it the Replica cannot open a replication connection to the Primary.
# ---------------------------------------------------------------------------
# TYPE          DATABASE      USER            ADDRESS        METHOD
local           all           all                            trust
host            all           all             127.0.0.1/32   trust
host            all           all             ::1/128        trust

# Streaming replication: user used by pg_basebackup / WAL receiver on Replica
host            replication replicator      0.0.0.0/0      scram-sha-256
host            replication replicator      ::/0           scram-sha-256

# Application connections (backend) — reads and writes
host            all           all             0.0.0.0/0      scram-sha-256
host            all           all             ::/0           scram-sha-256
